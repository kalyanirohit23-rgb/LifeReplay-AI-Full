kind = "web"
previewPath = "/"
title = "LifeReplay AI"
version = "1.0.0"
id = "artifacts/lifereplay"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20370

[services.development]
run = "pnpm --filter @workspace/lifereplay run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/lifereplay", "run", "build" ]
publicDir = "artifacts/lifereplay/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20370"
BASE_PATH = "/"
